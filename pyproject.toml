[project]
name = "second-brain"
version = "0.4.0"
description = "Local, deterministic evidence-freezing and human-review pipeline for evidence-grounded project knowledge (Work Second Brain, Stage 2)."
readme = "README.md"
authors = [
    { name = "Hiigami", email = "hiigami@protonmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml>=0.7.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
]

[project.scripts]
second-brain = "second_brain:main"

[project.optional-dependencies]
visual = [
    "cairosvg>=2.8,<3",
    "pillow>=12.3,<13",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tools/*.py"]
